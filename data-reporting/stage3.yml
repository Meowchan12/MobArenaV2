# ==========================================
# AREA 3: REWARDS SYSTEM
# ==========================================
# Syntax for keys:
# - 'X'              : Exact wave number (e.g., '10')
# - 'every X normal' : Recurring reward during normal waves (e.g., 'every 5 normal')
# - 'every X endless': Recurring reward during endless mode
#
# Supported reward types:
# - vault:<amount>   : Gives money (Requires Vault)
# - cmd(<command>)   : Executes a console command (%player% placeholder)
rewards:
  every 1 normal:
  - vault:600000.0
  every 5 normal:
  - vault:2000000.0
  every 10 normal:
  - vault:3000000.0
  '85':
  - vault:8000000.0
  every 3 endless:
  - 'after-game: true'
  - vault:2000000.0
# ==========================================
# AREA 4: SMART WAVES CONFIGURATION
# ==========================================
# -- WAVES SYNTAX GUIDE --
# 'wave_name': (Must be a unique name, cannot be duplicated)
#   waves: The condition to spawn this wave.
#      - Range     : '1-5' (Spawns from wave 1 to 5)
#      - List      : '3, 7' (Spawns on wave 3 and 7)
#      - Endless   : '21+' (Spawns from wave 21 until infinity)
#
#   priority: Resolves conflicts when multiple waves match.
#      - Priority 1: Highest (Always overrides others. Use for Bosses/Supplies).
#      - Priority 5: Lowest (Default).
#      - If priorities are equal, the system selects one randomly.
#
#   wave_types:
#      - mob    : Standard mob spawning.
#      - swarm  : Applies 'mob-multiplier' to spawn massive hordes.
#      - boss   : Summons Custom Bosses from bosses.yml.
#      - supply : Spawns a Supply Chest (Uses 'supply-id' and 'duration').
#
#   Modifiers (Optional):
#      - maxhp-bonus    : '+10' (Adds 10 HP) or 'x2.0' (Doubles base HP).
#      - damage-bonus   : '+2' or 'x1.5'.
#      - general-effect : 'speed:1, resistance:2' (Applies potion effects).
# ==========================================

