# ========================================================================
# MOB ARENA V2 - DEFAULT ARENA CONFIGURATION
# ------------------------------------------------------------------------
# This is the master template file. You can duplicate this file to create
# new arenas (e.g., map1.yml, map2.yml).
#
# IMPORTANT: Use standard YAML formatting (2 spaces per indentation).
# ========================================================================

# ==========================================
# AREA 1: GENERAL SETTINGS
# ==========================================
name: default
settings:
  enabled: true
  required-arena: stage2
  
  # The final wave of the normal game. Once completed, the Voting Phase
  # for Endless Mode will begin.
  max-waves: 100
  
  # Economy integration (Requires Vault)
  entry-fee:
    enabled: false
    type: VAULT
    amount: 100.0
  
  rules:
    mob-drop: false
    player-pvp: false
    block-break: true
    block-place: true
    item-drop: true
    allow-commands: false
    command-whitelist:
    - /ma leave
    - /ma class
  
  wave-conditions:
    # If true, the next wave will NOT start until all mobs are killed.
    clear-mob-before-next-wave: true
    clear-boss-before-next-wave: true
    # Delay (in seconds) before the next wave spawns.
    next-wave: 6.0
  
  # ----------------------------------------
  # CONFIGURABLE ANNOUNCER
  # ----------------------------------------
  # Placeholders available:
  # %arena%       : Arena Name
  # %wave%        : Current Wave Reached
  # %max_wave%    : Maximum wave defined in settings
  # %top1_player% : MVP Name (%top2_player%, %top3_player% also available)
  # %top1_kills%  : MVP Kills
  # %top1_class%  : MVP Class Name
  announcer:
    announce-when-arena-ends: true
    messages:
      victory:
      - '&e=========================================='
      - '&a&lVICTORY! &fArena &e%arena% &fhas been cleared!'
      - '&7Reached Wave: &b%wave%&7/&b%max_wave%'
      - ''
      - '&e&lTOP MVPs:'
      - ' &61. &f%top1_player% &7- &c%top1_kills% Kills &8(%top1_class%)'
      - ' &62. &f%top2_player% &7- &c%top2_kills% Kills &8(%top2_class%)'
      - ' &63. &f%top3_player% &7- &c%top3_kills% Kills &8(%top3_class%)'
      - '&e=========================================='
      defeat:
      - '&e=========================================='
      - '&c&lMATCH OVER! &fArena &e%arena%'
      - '&7Reached Wave: &b%wave%'
      - ''
      - '&e&lTOP MVPs:'
      - ' &61. &f%top1_player% &7- &c%top1_kills% Kills &8(%top1_class%)'
      - ' &62. &f%top2_player% &7- &c%top2_kills% Kills &8(%top2_class%)'
      - ' &63. &f%top3_player% &7- &c%top3_kills% Kills &8(%top3_class%)'
      - '&e=========================================='
  
  # ----------------------------------------
  # HARDCORE MECHANICS: ORBITAL STRIKE
  # ----------------------------------------
  # Randomly targets players with a deadly lightning strike during combat.
  hardcore-mechanics:
    lightning-strike:
      enabled: true
      interval: 15 # Triggers every 15 seconds
      strikes-per-wave:
        min: 1
        max: 3 # Spawns 1 to 3 strikes per interval
      damage:
        min: 8.0
        max: 20.0 # True damage dealt
        radius: 5.0 # AoE explosion radius
      phases: # Phases in seconds (1.0 = 20 ticks)
        silent-aim: 1.0 # Invisible tracking phase
        tracking-min: 1.0 # Minimum red warning circle duration
        tracking-max: 2.0 # Maximum red warning circle duration
        lock-on: 0.5 # Green circle lock-on time (dash away now!)

