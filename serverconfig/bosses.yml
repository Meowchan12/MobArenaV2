# ==============================================================================
# MobArenav2 - Bosses Configuration (Server Tuning & Raid Roster)
# [v8.3.0 GRAND FINALE]: Combat Overhaul, Armor Penetration, & Tactical Raid Skills
#
# NEW ATTRIBUTES IN v8.3.0:
# - Damage: Base attack damage attribute of the boss entity.
# - armor-penetration: Ratio (0.0 - 1.0) of melee damage that completely ignores armor/enchants as True Damage.
# - crushing-blow: (true/false) When true, boss periodically charges a 2.0s-2.5s telegraphed heavy strike (red ring + audio). Breaks shields (Shield Gate protects against 1-shots) or deals heavy damage to unblocked targets. Dodge >4.5m for 0 dmg.
# - max-hp-shred: Ratio (0.0 - 1.0) of player's Max HP dealt as bonus True Damage on basic melee hit.
#
# NEW TACTICAL RAID SKILLS IN v8.3.0:
# - shield_break_burst: Channels an 800 HP apocalypse barrier. Raid DPS check; breaks or inflicts 60% Max HP nuke.
# - telegraphed_slam: Places a visible 6m ground telegraph for 2.5s before striking for 70% Max HP.
# - chain_of_fate: Binds paired players with a fiery tether; must sprint >16m apart within 5s to snap it.
# - mortal_ground: Corrupts a 3.5m ground zone for 10s; deals wither damage and reduces healing received by -80%.
# - blood_frenzy: Activates when boss falls below 30% HP; attacks heal 1% Max HP and gain terrifying particles.
# ==============================================================================

incarnation_of_the_radius:
  type: WARDEN
  Boss_displayname: '&4&l☠ Incarnation of the Radius ☠'
  Bossbar: true
  nametagshow: true
  HP: 200000.0
  Damage: 75.0
  armor-penetration: 0.50
  crushing-blow: true
  max-hp-shred: 0.05
  size: huge # [v7.0] 3.5x scale - Massive entity
  spawn-random-player: false
  spawn-message: '&4&l⚠ THE GROUND TREMBLES... An ancient evil has awakened! THE INCARNATION OF THE RADIUS HAS RISEN! ⚠'
  spawn-sound: ENTITY_WARDEN_EMERGE
  loot-supply: boss_loot_legendary
  effect-bonus: resistance:2, fire_resistance:1
  Equip: []
  
  # [v7.0] Counter-Meta Configuration
  counter-meta:
    damage-cap: 200 # Max damage per single hit
    
    anti-mace:
      enabled: true
      damage-threshold: 100 # Triggers if single hit > 100
      reflect-multiplier: 1000 # 1000% reflected back to attacker
      disarm: true # Knock weapon out of hand
    
    anti-elytra:
      enabled: true
      radius: 50 # Detection radius
      damage: 15.0 # True damage when caught flying
    
    anti-ranged:
      enabled: true
      reflect-multiplier: 3.0 # 300% reflected damage
      pull-range: 30.0 # Pull players closer if beyond this range
    
    anti-totem:
      enabled: true # Boss skills bypass Totem of Undying
  
  # [v7.0] Multi-Phase Boss Configuration
  phases:
    phase_1:
      hp-threshold: 100 # Active from 100% HP (initial phase)
      skills:
      - earthquake_smash
      - void_prison
      - knockbacker
      - telegraphed_slam
      - chain_of_fate
      on-enter-skills: []
      on-enter-message: ''
    
    phase_2:
      hp-threshold: 60 # Triggers at 60% HP
      skills:
      - soul_drain
      - minion_call
      - earthquake_smash
      - toxic_nova
      - shield_break_burst
      - mortal_ground
      on-enter-skills:
      - enrage
      on-enter-message: '&4&l[PHASE 2] &c%boss% &eroars with bloodthirst! Thorns activate!'
    
    phase_3:
      hp-threshold: 20 # Triggers at 20% HP
      god-mode: true
      god-mode-duration: 10 # 10 seconds of invulnerability
      skills:
      - toxic_nova
      - ultimate_arrow
      - meteor_shower
      - magnetic_pull
      - blood_frenzy
      - abyssal_tether
      on-enter-skills:
      - enrage
      on-enter-message: '&4&l[FINAL PHASE] &c%boss% &4ENTERS GOD MODE! SURVIVE THE ONSLAUGHT!'

