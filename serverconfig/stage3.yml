# ========================================================================
# MOB ARENA V2 - STAGE 3 ARENA CONFIGURATION
# ------------------------------------------------------------------------
# [v8.3.2 REBALANCED & OVERHAULED]:
# - Rebalanced mob counts from early game to end game (scaled down drastically).
# - Tuned for 1-4 players: No more 200+ mob spam on 2-player sessions!
# - Integrated all 22 tactical raid bosses from v8.3.0 & v8.3.1.
# - Integrated high-priority Support Witches (Healer Witch & War Witch).
# - 100% English language compliance.
# ========================================================================

# ==========================================
# AREA 1: GENERAL SETTINGS
# ==========================================
name: default
settings:
  enabled: true
  required-arena: stage2

  base-health: 60.0
  base-health-per-class:
    finallaw: 80.0
    Alchemist: 90.0

  # [v8.4.0 CENTRALIZED]: Upgrade system settings (intervals, slots, draft rates)
  # are now centrally managed in settings.yml under 'upgrade-system.arenas.stage3'
  # (auto-generated from 'upgrade-system.default' when loaded).

  # Final wave of normal game. Voting Phase for Endless Mode triggers after Wave 100.
  max-waves: 100

  # Economy integration (Requires Vault)
  entry-fee:
    enabled: false
    type: VAULT
    amount: 100.0

  rules:
    mob-drop: false
    player-pvp: false
    block-break: true
    block-place: true
    item-drop: true
    allow-commands: false
    command-whitelist:
    - /ma leave
    - /ma class

  wave-conditions:
    clear-mob-before-next-wave: true
    clear-boss-before-next-wave: true
    next-wave: 6.0

  # ----------------------------------------
  # CONFIGURABLE ANNOUNCER
  # ----------------------------------------
  announcer:
    announce-when-arena-ends: true
    messages:
      victory:
      - '&e=========================================='
      - '&a&lVICTORY! &fArena &e%arena% &fhas been cleared!'
      - '&7Reached Wave: &b%wave%&7/&b%max_wave%'
      - ''
      - '&e&lTOP MVPs:'
      - ' &61. &f%top1_player% &7- &c%top1_kills% Kills &8(%top1_class%)'
      - ' &62. &f%top2_player% &7- &c%top2_kills% Kills &8(%top2_class%)'
      - ' &63. &f%top3_player% &7- &c%top3_kills% Kills &8(%top3_class%)'
      - '&e=========================================='
      defeat:
      - '&e=========================================='
      - '&c&lMATCH OVER! &fArena &e%arena%'
      - '&7Reached Wave: &b%wave%'
      - ''
      - '&e&lTOP MVPs:'
      - ' &61. &f%top1_player% &7- &c%top1_kills% Kills &8(%top1_class%)'
      - ' &62. &f%top2_player% &7- &c%top2_kills% Kills &8(%top2_class%)'
      - ' &63. &f%top3_player% &7- &c%top3_kills% Kills &8(%top3_class%)'
      - '&e=========================================='

  # ----------------------------------------
  # HARDCORE MECHANICS: ORBITAL STRIKE
  # ----------------------------------------
  hardcore-mechanics:
    lightning-strike:
      enabled: true
      interval: 15 # Triggers every 15 seconds
      strikes-per-wave:
        min: 1
        max: 3
      damage:
        min: 8.0
        max: 20.0
        radius: 5.0
      phases:
        silent-aim: 1.0
        tracking-min: 1.0
        tracking-max: 2.0
        lock-on: 0.5

