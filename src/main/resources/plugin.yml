name: MobArenav2
# Maven sẽ tự động thay placeholder này thành 3.0 khi build (nhờ filtering=true)
version: '${project.version}'
main: vn.meowchan12.mobarenav2.MobArenav2
api-version: '1.21'
prefix: MobArenav2
authors: [Meowchan12]

# Giữ nguyên depend và softdepend như bạn yêu cầu
depend: [Vault]
softdepend: [PlaceholderAPI, MythicMobs]

permissions:
  mobarenav2.admin:
    description: Grants full administrative access to MobArenav2
    default: op
  mobarenav2.bypass.arenalock:
    description: Bypasses arena unlock requirements
    default: op
  mobarenav2.player.join:
    description: Allows joining arenas
    default: true
  mobarenav2.player.leave:
    description: Allows leaving arenas
    default: true
  mobarenav2.player.spec:
    description: Allows spectating arenas
    default: true
  mobarenav2.player.list:
    description: Allows listing arenas
    default: true

commands:
  ma:
    description: Core command for MobArenav2
    usage: /ma <join|leave|setup|...>
    aliases: [mobarena]