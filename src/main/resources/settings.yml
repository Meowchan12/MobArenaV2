# ==========================================
# GENERAL SETTINGS
# ==========================================
prefix: "&#FF5555[&lMobArena V2&r&#FF5555] &r" # Modern Hex Color

# ==========================================
# SCOREBOARD CONFIGURATION (Right-side Scoreboard)
# Placeholders available:
# %arena%       - Arena Name
# %wave%        - Current Wave
# %next_wave%   - Next Wave Number
# %mobs%        - Remaining Mobs
# %players%     - Alive Players Count
# %dead%        - Dead/Spectator Count
# %kills%       - Player's Personal Kills
# %next_boss%   - Wave number of Next Boss (or "None")
# %next_supply% - Wave number of Next Supply Drop (or "None")
# ==========================================
scoreboard:
  enabled: true
  title: "&#FF5555&lᴍᴏʙᴀʀᴇɴᴀ"
  lines:
    - "&7&m-------------------"
    - "&fᴀʀᴇɴᴀ: &e%arena%"
    - "&fsᴛᴀᴛᴜs: &a%players% Alive &7| &c%dead% Dead"
    - "&fᴘʟᴀʏᴇʀs:"
    - "+++"
    - " &b%index%. %player% &f- Kills: &e%kills% &7(%status%&7)"
    - "+++"
    - ""
    - "&fᴍᴏʙ ʀᴇᴍᴀɪɴɪɴɢ: &c%mobs%"
    - "&fɴᴇxᴛ ᴡᴀᴠᴇ: &e%next_wave%"
    - "&fɴᴇxᴛ sᴜᴘᴘʟʏ ᴡᴀᴠᴇ: &b%next_supply%"
    - "&cɴᴇxᴛ ʙᴏss ᴡᴀᴠᴇ: &4%next_boss%"
    - "&7&m-------------------"

# ==========================================
# GUI CONFIGURATION
# ==========================================
gui:
  # Endless Mode Voting Menu
  vote:
    title: "Enter Endless Mode?"
    yes-item:
      material: EMERALD_BLOCK
      name: "&a&lCONTINUE (YES)"
      lore:
        - "&7Vote to enter Endless Mode."
        - "&7Double difficulty, massive rewards!"
    no-item:
      material: REDSTONE_BLOCK
      name: "&c&lSTOP (NO)"
      lore:
        - "&7Vote to end the match."
        - "&7Claim your rewards and return to Lobby."

  # Upgrade Selection Menu (Used if the Upgrade system is enabled)
  upgrade:
    title: "Choose Upgrade (Wave %wave%)"
    swarm-title: "&#FF55FF&l✦ SWARM VICTORY UPGRADE ✦ &8(%left% Left)"
    boss-title: "&#FFAA00&l✦ BOSS VICTORY UPGRADE ✦ &8(%left% Left)"
    starter-title: "&#00FFFF&l✦ STARTER UPGRADE ✦ &8(%left% Left)"

# ==========================================
# ROGUELIKE UPGRADE SYSTEM CONFIGURATION (v8.4.0 CENTRALIZED)
# ==========================================
# Single Source of Truth for all arenas.
# 'default' is the master template. Whenever the plugin detects any other arena
# (e.g., stage1, stage2, stage3), it automatically copies 'default' into
# 'upgrade-system.arenas.<arena_name>' so you can customize each arena directly here!
# ==========================================
upgrade-system:
  default:
    enabled: true

    # Trigger Mode Options (for standard normal waves):
    #   "INTERVAL"       : Triggers every X waves (configured by trigger-every-waves).
    #   "SPECIFIC_WAVES" : Triggers only on listed wave numbers (configured by specific-waves).
    #   "STAGE_BASED"    : Triggers per wave range / stage intervals (configured by stage-triggers).
    mode: "INTERVAL"

    # [INTERVAL MODE] Trigger normal upgrade selection menu every X waves cleared
    trigger-every-waves: 5

    # [SPECIFIC_WAVES MODE] List of wave numbers that offer normal upgrades
    specific-waves:
      - 5
      - 10
      - 15
      - 20
      - 25
      - 30

    # [STAGE_BASED MODE] Configure different upgrade frequencies per stage / wave range
    stage-triggers:
      stage_1:
        min-wave: 1
        max-wave: 10
        interval: 5
      stage_2:
        min-wave: 11
        max-wave: 30
        interval: 3

    # Default maximum upgrade slots per player (limits active different upgrade types)
    default-max-slots: 3

    # Class-specific upgrade slot limits (overrides default-max-slots per class)
    class-slots:
      Knight: 4
      Archer: 3
      Alchemist: 4
      Juggernaut: 2

    # When a Boss or Swarm wave also lands on a normal interval wave (e.g., Wave 15):
    #   false (recommended): Grants ONLY the Boss/Swarm reward choices (prevents 3+1=4 inflation).
    #   true               : Grants BOTH the Boss/Swarm choices AND the normal interval choice(s).
    stack-with-interval: false

    # Starter Upgrade (Granted right after lobby countdown when entering the arena)
    starter-upgrade:
      enabled: true
      upgrade-count: 1
      normal-chance: 90.0
      super-chance: 10.0
      guaranteed-super-slots: 0
      max-super-slots: 1

    # Configurable Upgrade Draft Counts & Normal/Super Roll Rates per Wave Type
    draft-rates:
      normal:
        grant-count: 1
        normal-chance: 90.0
        super-chance: 10.0
        guaranteed-super-slots: 0
        max-super-slots: 1
        pity-threshold: 4 # Guaranteed 1 Super after 4 dry normal drafts (0 = disabled)
      swarm:
        grant-count: 2
        normal-chance: 75.0
        super-chance: 25.0
        guaranteed-super-slots: 0
        max-super-slots: 2
        pity-threshold: 0
      boss:
        grant-count: 3
        normal-chance: 35.0
        super-chance: 65.0
        guaranteed-super-slots: 1
        max-super-slots: 3
        pity-threshold: 0

# ==========================================
# BROADCAST & ANNOUNCEMENTS
# (All in-game messages are centralized in messages.yml)
# ==========================================
broadcast-join-to-all-server: false

# ==========================================
# ROGUELIKE UPGRADE REROLL CONFIGURATION
# ==========================================
upgrade-reroll:
  enabled: true
  material: "RECOVERY_COMPASS"
  slot: 22
  base-cost: 150.0
  wave-factor: 25.0
  max-rerolls-per-wave: 3
  # Tiered multipliers per reroll attempt:
  # Attempt 1: BaseBracket * 10
  # Attempt 2: Attempt 1 * 8
  # Attempt 3: Attempt 2 * 7
  multipliers:
    1: 10.0
    2: 8.0
    3: 7.0
  messages:
    not-enough-money: "&c[MobArenav2] You need &e$%cost% &cto reroll upgrades! (Your balance: &e$%balance%&c)"
    limit-reached: "&c[MobArenav2] You have reached the maximum reroll limit for this wave! (%max%/%max%)"
    success: "&a[MobArenav2] Rerolled upgrades for &e$%cost%&a! &7(Wave reroll: &e%count%/%max%&7)"

# ==========================================
# CELEBRATION & VICTORY REWARDS
# ==========================================
celebrations:
  milestone-waves:
    interval: 5
    title: "&6&l★ WAVE %wave% CLEARED! ★"
    subtitle: "&ePrepare for the upcoming challenges!"
    fireworks: true

  victory:
    title: "&#FFAA00&l★ VICTORY ACHIEVED! ★"
    subtitle: "&#55FF55&lAll waves conquered! You are the Arena Champion!"
    broadcast: "&6[MobArenav2] &eTeam &f%players% &ehas conquered arena &b%arena%&e!"
    firework-count: 5

# ==========================================
# COMBAT & MOB HIT DELAY CONFIGURATION
# ==========================================
combat:
  # Invulnerability cooldown (in ticks) when arena mobs receive damage from players.
  # 10 ticks = 0.5s (Vanilla default).
  # Set to 0 for instant, rapid-hit arcade combat without damage delays/immune frames.
  mob-hit-delay-ticks: 10

# ==========================================
# DATABASE STORAGE CONFIGURATION (v8.0.0)
# Supports SQLITE (embedded mobarena.db) or MYSQL/MARIADB
# ==========================================
database:
  type: "SQLITE" # SQLITE or MYSQL
  sqlite:
    file: "mobarena.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "mobarena"
    username: "root"
    password: ""
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

# ==========================================
# [v8.3.0] SUPPORT MOBS SYSTEM CONFIGURATION
# High-priority tactical support witches:
# - Healer Witch: Green glow, 64m aura healing 5% Max HP to mobs/bosses.
# - War Witch (Buffer): Red glow, 48m aura stacking Strength (No Cap) every 5s.
# ==========================================
support-mobs:
  healer_witch:
    display-name: "&#55FF55&l[Healer Witch]"
    glow-color: "GREEN"
    scale: 1.25
    base-hp: 80.0
    hp-per-wave: 6.0
    max-hp-cap: 400.0
    aura-radius: 64.0
    heal-percent: 0.05
    pulse-interval-seconds: 4

  buffer_witch:
    display-name: "&#FF5555&l[War Witch]"
    glow-color: "RED"
    scale: 1.25
    base-hp: 80.0
    hp-per-wave: 6.0
    max-hp-cap: 400.0
    aura-radius: 48.0
    pulse-interval-seconds: 5
    buff-duration-seconds: 10
    max-strength-cap: -1 # -1 = No Cap (Infinite Stacking)

# ==========================================
# [v8.4.5] GLOBAL SHOP SYSTEM CONFIGURATION
# ==========================================
shop:
  # Customizable Currency Names used in chat, tooltips, and confirmation prompts
  currency-names:
    vault: "Vault Money"
    playerpoints: "PlayerPoints"
    custom_command: "Casino Chips"

  # Confirmation Dialog Settings
  # Any purchase at or above these thresholds requires double-clicking within timeout
  confirmation-thresholds:
    vault: 1000000.0
    playerpoints: 1000.0
    custom_command: 1000.0
  confirmation-timeout-ms: 3000

  # GUI Styling & Aesthetic Configs
  gui:
    main-title: "&0&l📜 MOBARENA GLOBAL SHOP"
    main-filler: "BLACK_STAINED_GLASS_PANE"
    guide-title: "&0&l📖 SHOP UPGRADE GUIDE"
    guide-filler: "LIGHT_BLUE_STAINED_GLASS_PANE"
    category-filler: "GRAY_STAINED_GLASS_PANE"

  # Ultimates Combat Tuning
  ultimates:
    max-cooldown-reduction: 0.25 # Max 25% cooldown reduction cap from custom stats

