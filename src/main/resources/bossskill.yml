# ==========================================
# Basic Skill
# ==========================================
earthquake:
  display-name: "Earthquake Slam"
  type: AREA_DAMAGE
  message: "&c&l[EARTHQUAKE] &4%boss% &eslams the ground with &c%skill%&e!"
  radius: 6.0
  damage: 12.0
  armor-penetration: 0.35 # 35% armor penetration (Layered Piercing Damage)

gravity_pull:
  display-name: "Gravity Void"
  type: PULL
  message: "&5&l[VOID] &d%boss% &eis pulling everyone close with &5%skill%&e!"
  radius: 12.0
  strength: 1.5

lightning_strike:
  display-name: "Wrath of the Heavens"
  type: LIGHTNING
  message: "&e&l[THUNDER] &6%boss% &ecalls upon the &e%skill%&e!"
  targets: 3
  damage: 10.0

absolute_defense:
  display-name: "God Mode"
  type: INVULNERABLE
  message: "&b&l[SHIELD] &3%boss% &eenters &b%skill%&e! Attacks are useless!"
  cooldown: 20
  duration: 5

